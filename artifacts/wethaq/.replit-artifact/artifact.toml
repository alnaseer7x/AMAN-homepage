kind = "web"
previewPath = "/wethaq/"
title = "WETHAQ"
description = "منصة عربية لتنظيم الاتفاقات المالية بين العملاء ومقدمي الخدمات المستقلة، تبدأ بصفحة رئيسية وتجربة حفظ سجل واحد في Supabase."
version = "1.0.0"
id = "artifacts/wethaq"
router = "path"

[[services]]
name = "web"
paths = [ "/wethaq/" ]
localPort = 25886

[services.development]
run = "pnpm --filter @workspace/wethaq run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wethaq", "run", "build" ]
serve = "static"
publicDir = "artifacts/wethaq/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25886"
BASE_PATH = "/wethaq/"
